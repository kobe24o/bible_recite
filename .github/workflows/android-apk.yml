name: App releases

on:
  workflow_dispatch:
    inputs:
      apple_destination:
        description: Apple signing/store operation (none runs normal app release)
        type: choice
        options: [none, inspect, app-store, direct, all]
        default: none
      desktop_only:
        description: Build and publish only desktop preview installers
        type: boolean
        default: false
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ !inputs.desktop_only && (!inputs.apple_destination || inputs.apple_destination == 'none') }}
    name: Build signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Download offline speech models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/offline-models" assets/models
          gh release download offline-models-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern sherpa-models.zip \
            --dir "$RUNNER_TEMP/offline-models"
          unzip -oq "$RUNNER_TEMP/offline-models/sherpa-models.zip" \
            -d assets/models || {
              status=$?
              test "$status" -eq 1 || exit "$status"
            }

      - name: Verify offline speech models
        run: |
          for file in encoder.onnx decoder.onnx joiner.onnx tokens.txt; do
            test -s "assets/models/sherpa/$file" || {
              echo "Missing assets/models/sherpa/$file" >&2
              exit 1
            }
          done

      - name: Bundle latest shared quiz bank
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shard_dir="$RUNNER_TEMP/quiz-bank-shards"
          mkdir -p assets/quiz_bank "$shard_dir"
          index_url="$(gh api repos/kobe24o/bible-recite-plans/contents/quiz-bank.index.json --jq .download_url)"
          curl --fail --location "$index_url" --output "$RUNNER_TEMP/quiz-bank.index.json"
          while IFS= read -r shard_path; do
            mkdir -p "$shard_dir/$(dirname "$shard_path")"
            shard_url="$(gh api "repos/kobe24o/bible-recite-plans/contents/$shard_path" --jq .download_url)"
            curl --fail --location "$shard_url" --output "$shard_dir/$shard_path"
          done < <(jq -r '.shards[].path' "$RUNNER_TEMP/quiz-bank.index.json")
          dart run tool/bundle_quiz_bank.dart \
            --index "$RUNNER_TEMP/quiz-bank.index.json" \
            --shard-dir "$shard_dir" \
            --output-bank assets/quiz_bank/quiz-bank.json \
            --output-index assets/quiz_bank/quiz-bank.index.json

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/bible-recite.keystore"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/bible-recite.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Create versioned artifact
        shell: bash
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          test -n "$version"
          version_name="${version%%+*}"
          build_number="${version##*+}"
          apk_name="BibleRecite-${version_name}-build-${build_number}.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$apk_name"
          (cd dist && sha256sum "$apk_name" > "$apk_name.sha256")
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"

      - name: Verify APK signing certificate
        env:
          EXPECTED_CERT_SHA256: 4066fe3c0e57ec575e5d37b741d68d347f8af80b7cf9da4799636d7039b5a7e7
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f \
            -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          actual="$($apksigner verify --print-certs "dist/$APK_NAME" | \
            awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}' | \
            tr -d '\r[:space:]')"
          echo "Expected certificate SHA-256: $EXPECTED_CERT_SHA256"
          echo "Actual certificate SHA-256:   $actual"
          if [[ -z "$actual" || "$actual" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "APK signing certificate does not match the permanent release key." >&2
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_NAME }}
          path: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

  ios:
    if: ${{ !inputs.desktop_only && (!inputs.apple_destination || inputs.apple_destination == 'none') }}
    name: Build iOS simulator app
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Download offline speech models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/offline-models" assets/models
          gh release download offline-models-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern sherpa-models.zip \
            --dir "$RUNNER_TEMP/offline-models"
          unzip -oq "$RUNNER_TEMP/offline-models/sherpa-models.zip" \
            -d assets/models || {
              status=$?
              test "$status" -eq 1 || exit "$status"
            }

      - name: Verify offline speech models
        run: |
          for file in encoder.onnx decoder.onnx joiner.onnx tokens.txt; do
            test -s "assets/models/sherpa/$file" || {
              echo "Missing assets/models/sherpa/$file" >&2
              exit 1
            }
          done

      - name: Bundle latest shared quiz bank
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shard_dir="$RUNNER_TEMP/quiz-bank-shards"
          mkdir -p assets/quiz_bank "$shard_dir"
          index_url="$(gh api repos/kobe24o/bible-recite-plans/contents/quiz-bank.index.json --jq .download_url)"
          curl --fail --location "$index_url" --output "$RUNNER_TEMP/quiz-bank.index.json"
          while IFS= read -r shard_path; do
            mkdir -p "$shard_dir/$(dirname "$shard_path")"
            shard_url="$(gh api "repos/kobe24o/bible-recite-plans/contents/$shard_path" --jq .download_url)"
            curl --fail --location "$shard_url" --output "$shard_dir/$shard_path"
          done < <(jq -r '.shards[].path' "$RUNNER_TEMP/quiz-bank.index.json")
          dart run tool/bundle_quiz_bank.dart \
            --index "$RUNNER_TEMP/quiz-bank.index.json" \
            --shard-dir "$shard_dir" \
            --output-bank assets/quiz_bank/quiz-bank.json \
            --output-index assets/quiz_bank/quiz-bank.index.json

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build iOS simulator app
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          flutter build ios --simulator --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Validate and package iOS simulator app
        run: |
          app="build/ios/iphonesimulator/Runner.app"
          test -d "$app"
          bundle_id="$(plutil -extract CFBundleIdentifier raw \
            -o - "$app/Info.plist")"
          test "$bundle_id" = "app.biblerecite"
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          archive_name="BibleRecite-iOS-${version}-simulator.zip"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/$archive_name"
          (cd dist && shasum -a 256 "$archive_name" > "$archive_name.sha256")
          echo "IOS_ARTIFACT_NAME=$archive_name" >> "$GITHUB_ENV"

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.IOS_ARTIFACT_NAME }}
          path: |
            dist/${{ env.IOS_ARTIFACT_NAME }}
            dist/${{ env.IOS_ARTIFACT_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

  windows:
    if: ${{ !inputs.apple_destination || inputs.apple_destination == 'none' }}
    name: Test and build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Download offline speech models
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/offline-models" assets/models
          gh release download offline-models-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern sherpa-models.zip \
            --dir "$RUNNER_TEMP/offline-models"
          python - <<'PYMODELS'
          import os, pathlib, zipfile
          root = pathlib.Path('assets/models').resolve()
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP']) / 'offline-models/sherpa-models.zip') as archive:
              for entry in archive.infolist():
                  name = entry.filename.replace('\\', '/')
                  target = (root / name).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError('Invalid archive entry')
                  if entry.is_dir() or name.endswith('/'):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(entry))
          for name in ('encoder.onnx', 'decoder.onnx', 'joiner.onnx', 'tokens.txt'):
              assert (root / 'sherpa' / name).stat().st_size > 0, name
          PYMODELS

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit and widget tests
        env:
          TZ: UTC
        run: flutter test

      - name: Test native Windows services and desktop UI
        run: flutter test integration_test/desktop_smoke_test.dart -d windows

      - name: Build Windows release
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build windows --release `
            --dart-define=SUPABASE_URL="$env:SUPABASE_URL" `
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$env:SUPABASE_PUBLISHABLE_KEY"

      - name: Package and verify Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace '^version:\s*', '').Trim()
          $versionName, $buildNumber = $version.Split('+')
          $bundle = (Resolve-Path 'build/windows/x64/runner/Release').Path
          foreach ($required in @('bible_recite.exe', 'flutter_windows.dll', 'msvcp140.dll', 'vcruntime140.dll', 'data/flutter_assets/assets/models/sherpa/encoder.onnx')) {
            if (!(Test-Path (Join-Path $bundle $required))) { throw "Missing runtime file: $required" }
          }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $dist = (Resolve-Path dist).Path
          & $compiler "/DAppVersion=$versionName" "/DBuildNumber=$buildNumber" "/DSourceDir=$bundle" "/DOutputDir=$dist" tool/desktop/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $installer = Get-Item "dist/BibleRecite-Windows-$versionName-build-$buildNumber-x64-setup.exe"
          $installPath = Join-Path $env:RUNNER_TEMP 'BibleRecite-install-test'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installPath") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          if (!(Test-Path "$installPath/bible_recite.exe")) { throw 'Installed executable missing' }
          $app = Start-Process -FilePath "$installPath/bible_recite.exe" -WorkingDirectory $installPath -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "Installed application exited unexpectedly: $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          $uninstall = Start-Process -FilePath "$installPath/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Installer uninstall test failed' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File "$($installer.FullName).sha256" -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.exe.sha256
          if-no-files-found: error
          retention-days: 30

  macos:
    if: ${{ !inputs.apple_destination || inputs.apple_destination == 'none' }}
    name: Test and build macOS universal DMG
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Download offline speech models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/offline-models" assets/models
          gh release download offline-models-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern sherpa-models.zip \
            --dir "$RUNNER_TEMP/offline-models"
          unzip -oq "$RUNNER_TEMP/offline-models/sherpa-models.zip" \
            -d assets/models || {
              status=$?
              test "$status" -eq 1 || exit "$status"
            }

      - name: Verify offline speech models
        run: |
          for file in encoder.onnx decoder.onnx joiner.onnx tokens.txt; do
            test -s "assets/models/sherpa/$file" || {
              echo "Missing assets/models/sherpa/$file" >&2
              exit 1
            }
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit and widget tests
        env:
          TZ: UTC
        run: flutter test

      - name: Test native macOS services and desktop UI
        run: flutter test integration_test/desktop_smoke_test.dart -d macos

      - name: Build macOS release
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build macos --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify and package macOS app
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/bible_recite.app"
          test -d "$app"
          lipo "$app/Contents/MacOS/bible_recite" -verify_arch arm64
          lipo "$app/Contents/MacOS/bible_recite" -verify_arch x86_64
          test -s "$app/Contents/Frameworks/App.framework/Resources/flutter_assets/assets/models/sherpa/encoder.onnx"
          codesign --verify --deep --strict "$app"
          bash tool/desktop/package-macos.sh
          hdiutil verify dist/*.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v6
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: ${{ !inputs.desktop_only && (!inputs.apple_destination || inputs.apple_destination == 'none') }}
    name: Publish validated app release
    needs:
      - android
      - ios
      - windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter for signed manifest
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Install manifest dependencies
        run: flutter pub get

      - name: Download validated artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Verify artifact checksums
        run: |
          cd dist
          sha256sum -c BibleRecite-*.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          version_name="${version%%+*}"
          build_number="${version##*+}"
          tag="build-${version_name}-build-${build_number}-${GITHUB_RUN_NUMBER}"
          # The release step also attaches BibleRecite-latest.apk.  The update
          # manifest must keep referring to the immutable, versioned asset.
          apk_name="$(find dist -maxdepth 1 -type f -name 'BibleRecite-*.apk' ! -name 'BibleRecite-latest.apk' -printf '%f\n')"
          test -n "$apk_name"
          cp "dist/$apk_name" dist/BibleRecite-latest.apk
          gh release create "$tag" dist/* \
            --latest \
            --target "$GITHUB_SHA" \
            --title "BibleRecite ${version_name} build ${build_number}" \
            --notes "灵修年月选择弹窗为有笔记的日期显示绿色小点；日历为今天的日期显示圆圈，切换选中日期后仍保留今天标记。新增 Windows x64 安装程序和 macOS 通用 DMG 测试包（未经发布证书签名/公证），支持桌面离线背诵和提醒。"

      - name: Publish signed update feed
        env:
          UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPDATE_MANIFEST_PRIVATE_KEY"
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          version_name="${version%%+*}"
          build_number="${version##*+}"
          tag="build-${version_name}-build-${build_number}-${GITHUB_RUN_NUMBER}"
          # Do not select the moving latest alias: its corresponding SHA file
          # does not exist and the signed feed must reference a fixed asset.
          apk_name="$(find dist -maxdepth 1 -type f -name 'BibleRecite-*.apk' ! -name 'BibleRecite-latest.apk' -printf '%f\n')"
          test -n "$apk_name"
          sha256="$(awk '{print $1}' "dist/$apk_name.sha256")"
          dart run tool/update_feed/bin/create_update_envelope.dart \
            --apk "dist/$apk_name" \
            --sha256 "$sha256" \
            --version-name "$version_name" \
            --build-number "$build_number" \
            --source-commit "$GITHUB_SHA" \
            --release-page-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" \
            --download-url "https://ghfast.top/$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$apk_name" \
            --fallback-download-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$apk_name" \
              --release-notes "灵修年月选择弹窗为有笔记的日期显示绿色小点；日历为今天的日期显示圆圈，切换选中日期后仍保留今天标记。" \
            --output "$RUNNER_TEMP/latest.json"
          feed_dir="$RUNNER_TEMP/update-feed"
          git worktree add --detach "$feed_dir"
          pushd "$feed_dir"
          git checkout --orphan update-feed
          git rm -rf .
          mkdir -p updates
          cp "$RUNNER_TEMP/latest.json" updates/latest.json
          git add updates/latest.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "publish: update feed $version"
          git push --force origin HEAD:update-feed

  desktop-preview-release:
    name: Publish desktop preview installers
    if: ${{ inputs.desktop_only && (!inputs.apple_destination || inputs.apple_destination == 'none') }}
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Verify and publish desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c BibleRecite-*.sha256)
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          tag="desktop-preview-${version}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/* \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "BibleRecite ${version} desktop preview" \
            --notes "Windows x64 安装程序和 macOS 15.5+ 通用 DMG 测试包。包含离线语音识别和桌面提醒。安装包未经发布证书签名/公证，系统可能提示未知发布者。Windows/macOS 单元测试、原生集成测试及打包校验通过后发布；不更新 Android APK 或正式版更新源。"

  apple-distribution:
    name: Apple signing and App Store distribution
    if: ${{ inputs.apple_destination && inputs.apple_destination != 'none' }}
    uses: ./.github/workflows/apple-distribution.yml
    with:
      destination: ${{ inputs.apple_destination }}
    secrets: inherit
