name: Apple desktop distribution
on:
  workflow_call:
    secrets:
      APPSTORE_API_PRIVATE_KEY:
        required: true
      MACOS_CERTIFICATE_PRIVATE_KEY:
        required: false
      SUPABASE_PUBLISHABLE_KEY:
        required: false
    inputs:
      destination:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      destination:
        description: Apple distribution operation
        type: choice
        options: [inspect, app-store]
        default: inspect
permissions:
  contents: read
concurrency:
  group: apple-desktop-distribution
  cancel-in-progress: false
jobs:
  inspect:
    name: Check Apple distribution access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      MACOS_BUNDLE_ID: app.biblerecite
    steps:
      - uses: actions/checkout@v5
      - name: Test Apple release automation
        run: node --test scripts/apple-distribution.test.mjs
      - name: Inspect existing app, platforms and certificates
        run: node scripts/apple-distribution.mjs inspect

  app-store:
    name: Sign and upload macOS App Store build
    if: ${{ inputs.destination == 'app-store' }}
    needs: inspect
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MACOS_BUNDLE_ID: app.biblerecite
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ vars.APPSTORE_API_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.MACOS_CERTIFICATE_PRIVATE_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned signing tools
        run: python -m pip install codemagic-cli-tools==0.70.0
      - name: Obtain Mac App Store signing certificates and profile
        run: bash scripts/prepare-macos-appstore-signing.sh
      - name: Prepare macOS App Store version
        run: node scripts/apple-distribution.mjs prepare-store
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true
      - name: Download offline speech models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offline-models" assets/models
          gh release download offline-models-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern sherpa-models.zip --dir "$RUNNER_TEMP/offline-models"
          unzip -oq "$RUNNER_TEMP/offline-models/sherpa-models.zip" -d assets/models || {
            status=$?
            test "$status" -eq 1 || exit "$status"
          }
          for file in encoder.onnx decoder.onnx joiner.onnx tokens.txt; do
            test -s "assets/models/sherpa/$file"
          done
      - run: flutter pub get
      - name: Run application tests
        env:
          TZ: UTC
        run: flutter test
      - name: Build Mac App Store app
        run: |
          flutter build macos --release --build-number="$(date -u +%Y%m%d%H%M%S)" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Package signed Mac App Store installer
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/bible_recite.app"
          codesign --verify --deep --strict "$app"
          identity="$(security find-identity -v -p basic | awk -F '\"' '/3rd Party Mac Developer Installer/ { print $2; exit }')"
          test -n "$identity" || { echo 'Missing Mac Installer Distribution identity' >&2; exit 1; }
          mkdir -p dist
          productbuild --component "$app" /Applications --sign "$identity" dist/BibleRecite-Mac-App-Store.pkg
          pkgutil --check-signature dist/BibleRecite-Mac-App-Store.pkg
      - name: Validate and upload macOS build to App Store Connect
        run: app-store-connect publish --path dist/BibleRecite-Mac-App-Store.pkg --enable-package-validation
      - name: Save signed App Store package
        uses: actions/upload-artifact@v6
        with:
          name: macos-app-store-signed-package
          path: dist/*.pkg
          if-no-files-found: error
      - name: Restore login keychain
        if: ${{ always() }}
        run: keychain use-login || true
