name: Capture iPhone Duo screenshots
on:
  push:
    branches: [codex/iphone-duo-screenshots]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true
      - run: mkdir -p assets/models/sherpa
      - run: flutter pub get
      - run: flutter test tool/screenshots/duo_capture_test.dart
      - uses: actions/upload-artifact@v6
        with:
          name: iphone-duo-screenshots
          path: build/iphone_duo/*.png
